name: CI

# Quality gate for InterviewBudAI.
# Runs on every PR to main and on pushes to feature branches.
# Branch protection (configured in GitHub settings) requires this to be green
# before the founder can merge. See .github/BRANCH_PROTECTION.md.

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

# Actions are pinned by full commit SHA (tag in the trailing comment), the
# same versions as release.yml where both use an action.

# Cancel superseded runs on the same ref to keep morning review fast.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / build / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node.js is set up unconditionally. We do NOT enable `cache: npm` here
      # because that requires a dependency lockfile (package-lock.json) which
      # does not exist pre-scaffold. Caching is enabled later, gated behind
      # scaffold detection, so pre-scaffold runs stay green.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          # v5+ can turn on npm caching by itself; keep it off so caching stays
          # with the explicit, scaffold-gated actions/cache step below.
          package-manager-cache: false

      # The repo starts before any code is scaffolded. Until package.json
      # exists, CI passes as a no-op so the foundation PR is green. Once the
      # monorepo is scaffolded (see progress/status.md), the steps below run
      # the real checks. Agents MUST NOT weaken these checks to pass (charter §3).
      - name: Detect project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "scaffolded=true" >> "$GITHUB_OUTPUT"
          else
            echo "scaffolded=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet — skipping build/test until the monorepo is scaffolded."
          fi

      # Enable npm caching only once the monorepo is scaffolded and a lockfile
      # exists. Guarded by scaffold detection so pre-scaffold runs don't fail on
      # the missing lockfile. Runs after Detect project by design.
      - name: Cache npm dependencies
        if: steps.detect.outputs.scaffolded == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        if: steps.detect.outputs.scaffolded == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.detect.outputs.scaffolded == 'true'
        run: npm run typecheck --if-present

      - name: Lint
        if: steps.detect.outputs.scaffolded == 'true'
        run: npm run lint --if-present

      - name: Build
        if: steps.detect.outputs.scaffolded == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.detect.outputs.scaffolded == 'true'
        run: npm test --if-present

  # ADR 0011 D6: the Docker path (Dockerfile + compose.yaml). No real model and
  # no secrets: Docker Model Runner is not available on GitHub runners, so the
  # smoke test runs compose.ci.yaml with scripts/ci/fake-openai.mjs instead.
  docker:
    name: docker build / compose config / smoke
    runs-on: ubuntu-latest
    env:
      # Pinned Compose plugin (>= 2.38 is needed for top-level `models:`).
      COMPOSE_VERSION: v5.5.1
      COMPOSE_SHA256: db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Docker Compose plugin
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL -o "$HOME/.docker/cli-plugins/docker-compose" \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          echo "${COMPOSE_SHA256}  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          docker version --format 'Engine {{.Server.Version}}'
          docker compose version

      - name: Validate compose files (models / endpoint_var / model_var)
        run: |
          # Canary keys in a .env AND the shell: Compose may use .env for
          # interpolation, but no key may reach the app service.
          printf 'ANTHROPIC_API_KEY=sk-ant-ci-canary\nOPENAI_API_KEY=sk-ci-canary\nIBAI_OPENAI_API_KEY=sk-ci-canary\n' > .env
          export ANTHROPIC_API_KEY=sk-ant-ci-canary OPENAI_API_KEY=sk-ci-canary
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.engine.yaml config -q
          IBAI_CI_DATA_DIR=/tmp/x IBAI_CI_HOST_CONFIG=/tmp/y docker compose -f compose.ci.yaml config -q
          # The JSON rendering omits top-level `models:`; check it separately.
          test "$(docker compose -f compose.yaml config --models)" = "ai/qwen3:4b-instruct-2507-q4_K_M"
          docker compose -f compose.yaml config | grep -qE '^ +context_size: 4096$'
          docker compose -f compose.yaml config --format json > /tmp/compose.json
          jq -e '
            .services.app.models.llm.endpoint_var == "IBAI_OPENAI_BASE_URL" and
            .services.app.models.llm.model_var == "IBAI_OPENAI_MODEL" and
            (.services.app.env_file == null) and
            ((.services.app.environment | keys) == ["IBAI_HOST_DATA_DIR", "IBAI_PUBLIC_PORT"]) and
            (.services.app.ports | length == 1 and .[0].host_ip == "127.0.0.1" and .[0].target == 4173) and
            ([.services.app.volumes[] | select(.target == "/host-config")][0].read_only == true) and
            ((.services.app.restart // "no") == "no")
          ' /tmp/compose.json
          if grep -q 'canary' /tmp/compose.json; then
            echo "A key from .env / the shell reached the rendered compose config" >&2
            exit 1
          fi
          rm .env
          # Host data folder: IBAI_HOST_DATA_DIR > IBAI_DATA_DIR (shell or .env,
          # as for `npm start`) > default; the display-only env always equals
          # the /data bind source.
          data_dir_is() {
            jq -e --arg d "$1" '
              ([.services.app.volumes[] | select(.target == "/data")][0].source == $d) and
              (.services.app.environment.IBAI_HOST_DATA_DIR == $d) and
              ([.services.app.volumes[] | select(.target == "/host-config")][0].source == ($ENV.HOME + "/.interviewbudai"))
            ' >/dev/null || { echo "data dir is not $1" >&2; exit 1; }
          }
          for f in "-f compose.yaml" "-f compose.yaml -f compose.engine.yaml"; do
            env -u IBAI_DATA_DIR -u IBAI_HOST_DATA_DIR docker compose $f config --format json |
              data_dir_is "$HOME/.interviewbudai/data"
            env -u IBAI_HOST_DATA_DIR IBAI_DATA_DIR=/tmp/ibai-pinned docker compose $f config --format json |
              data_dir_is /tmp/ibai-pinned
            printf 'IBAI_DATA_DIR=/tmp/ibai-dotenv\n' > .env
            env -u IBAI_DATA_DIR -u IBAI_HOST_DATA_DIR docker compose $f config --format json |
              data_dir_is /tmp/ibai-dotenv
            rm .env
            IBAI_DATA_DIR=/tmp/ibai-pinned IBAI_HOST_DATA_DIR=/tmp/ibai-host docker compose $f config --format json |
              data_dir_is /tmp/ibai-host
          done

      - name: Build the image
        run: docker build -t interviewbudai:local .

      - name: Smoke test (fake OpenAI-compatible server)
        run: bash scripts/ci/docker-smoke.sh
